name: Unzip WheelsDrive

on:
  push:
    branches:
      - main
    paths:
      - 'wheelsdrive_final.zip' # सिर्फ इस ज़िप फ़ाइल के अपलोड होने पर चलेगा
  workflow_dispatch: # बटन से मैन्युअली चलाने के लिए

jobs:
  unzip-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Target Directory
        run: mkdir -p ./wheelsdrive_extracted

      - name: Extract Zip File
        run: unzip wheelsdrive_final.zip -d ./wheelsdrive_extracted

      - name: Commit and Push Unzipped Files
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Extracted wheelsdrive_final.zip automatically" || echo "No changes to commit"
          git push
          
