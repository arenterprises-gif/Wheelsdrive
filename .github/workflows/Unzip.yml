name: Unzip and Extract Wheelsdrive

on:
  push:
    branches:
      - main

jobs:
  extract-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Unzip wheelsdrive-complete.zip
        run: |
          if [ -f "wheelsdrive-complete.zip" ]; then
            unzip wheelsdrive-complete.zip -d extracted_files
          else
            echo "File wheelsdrive-complete.zip नहीं मिली!"
            exit 1
          fi

      - name: Create Stores Directory and Move Files
        run: |
          mkdir -p stores
          # अनज़िप हुई फाइलों को 'stores' फोल्डर में कॉपी/मूव करें
          mv extracted_files/* stores/

      - name: Commit & Push to Repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stores/
          git commit -m "Add extracted files to stores"
          git push
